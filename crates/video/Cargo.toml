[package]
name = "video"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
libav = ["dep:ffmpeg-next", "dep:windows"]
ndi = []
spout = []

[dependencies]
bcdec_rs.workspace = true
ffmpeg-next = { workspace = true, optional = true, default-features = false, features = ["format", "software-scaling"] }
hap-parser.workspace = true
image.workspace = true
mp4.workspace = true
naga.workspace = true
pollster.workspace = true
protocol.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", optional = true, features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
