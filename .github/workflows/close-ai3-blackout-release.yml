name: Close AI3 Blackout Release lane

on:
  push:
    branches:
      - codex/ai3-r4-blackout-release
    paths:
      - .github/scripts/patch_blackout_release_receipt.py
      - .github/scripts/patch_blackout_release_runtime_guards.py
      - .github/scripts/patch_blackout_release_ui_guards.py
      - .github/workflows/close-ai3-blackout-release.yml

permissions:
  contents: write

concurrency:
  group: close-ai3-blackout-release
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out exact work branch
        uses: actions/checkout@v5
        with:
          ref: codex/ai3-r4-blackout-release
          fetch-depth: 0

      - name: Verify branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "codex/ai3-r4-blackout-release"
          git merge-base --is-ancestor df7e335c14fe82bb534fbd8867dcd431777e1522 HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/patch-start-head"

      - name: Apply strict Blackout Release wire patch
        shell: bash
        run: |
          set -euo pipefail
          patcher="$RUNNER_TEMP/patch_blackout_release_receipt.py"
          cp .github/scripts/patch_blackout_release_receipt.py "$patcher"
          python3 - "$patcher" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          old = "if old_count != 1 or new_count != 0:"
          new = "if old_count != 1 or (new_count != 0 and new not in old):"
          if source.count(old) != 1 or new in source:
              raise SystemExit("unexpected replace_exact helper shape")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          python3 "$patcher"

      - name: Repair baseline portability guards and helper types
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src-tauri/src/main.rs")
          source = path.read_text(encoding="utf-8")

          guard = "    #[cfg(all(feature = \"spout\", target_os = \"windows\", target_arch = \"x86_64\"))]\n"
          block = "    spout\n        .harvest_failed_workers(engine)\n        .map_err(|error| error.message)?;\n"
          guarded = guard + block
          guarded_count = source.count(guarded)
          if guarded_count == 1:
              pass
          elif guarded_count == 0 and source.count(block) == 1:
              source = source.replace(block, guarded, 1)
          else:
              raise SystemExit(
                  f"unexpected Spout harvest shape: guarded={guarded_count}, block={source.count(block)}"
              )

          helper = "fn replace_prepared_project_snapshot(\n    state: &State<'_, AppState>,\n"
          repaired = "fn replace_prepared_project_snapshot(\n    state: &AppState,\n"
          helper_count = source.count(helper)
          repaired_count = source.count(repaired)
          if repaired_count == 1:
              pass
          elif repaired_count == 0 and helper_count == 1:
              source = source.replace(helper, repaired, 1)
          else:
              raise SystemExit(
                  f"unexpected prepared-project helper shape: repaired={repaired_count}, original={helper_count}"
              )

          standby_helper = (
              "fn replace_prepared_project_snapshot_after_standby_stop(\n"
              "    state: &State<'_, AppState>,\n"
          )
          standby_repaired = (
              "fn replace_prepared_project_snapshot_after_standby_stop(\n"
              "    state: &AppState,\n"
          )
          standby_helper_count = source.count(standby_helper)
          standby_repaired_count = source.count(standby_repaired)
          if standby_repaired_count == 1:
              pass
          elif standby_repaired_count == 0 and standby_helper_count == 1:
              source = source.replace(standby_helper, standby_repaired, 1)
          else:
              raise SystemExit(
                  "unexpected standby-stop helper shape: "
                  f"repaired={standby_repaired_count}, original={standby_helper_count}"
              )

          path.write_text(source, encoding="utf-8")
          PY
          rm -f .github/workflows/diagnose-ai3-main.yml

      - name: Apply terminal receipt and legacy-release guards
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_blackout_release_runtime_guards.py

      - name: Apply Release UI guardrails
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_blackout_release_ui_guards.py

      - name: Verify bounded R4 diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'Changed files after patch:\n'
          printf '  %s\n' "${changed[@]}"
          required=(
            app/scripts/check-blackout-release-runtime.mjs
            app/src-tauri/src/control_plane.rs
            app/src-tauri/src/control_plane_runtime.rs
            app/src-tauri/src/main.rs
            app/src/App.tsx
            app/src/blackoutReleaseRuntimeController.ts
            app/src/components/LightingRuntimeControlsPanel.tsx
            app/src/components/WorkspaceChrome.tsx
            app/src/tauri-invoke-manifest.json
            app/src/tauriInvokeCommands.ts
            crates/protocol/src/control_plane_command.rs
          )
          for file in "${required[@]}"; do
            found=false
            for actual in "${changed[@]}"; do
              if [[ "$actual" == "$file" ]]; then
                found=true
                break
              fi
            done
            if [[ "$found" != true ]]; then
              echo "Required R4 patch file missing from diff: $file" >&2
              exit 1
            fi
          done
          for file in "${changed[@]}"; do
            case "$file" in
              .github/workflows/diagnose-ai3-main.yml|app/scripts/check-blackout-release-runtime.mjs|app/src-tauri/src/control_plane.rs|app/src-tauri/src/control_plane_runtime.rs|app/src-tauri/src/main.rs|app/src/App.tsx|app/src/blackoutReleaseRuntimeController.ts|app/src/components/LightingRuntimeControlsPanel.tsx|app/src/components/WorkspaceChrome.tsx|app/src/tauri-invoke-manifest.json|app/src/tauriInvokeCommands.ts|crates/protocol/src/control_plane_command.rs)
                ;;
              *)
                echo "Unexpected changed file in R4 generated patch: $file" >&2
                exit 1
                ;;
            esac
          done

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libclang-dev \
            libssl-dev \
            libswscale-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            ffmpeg

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: syndocal-ai3-blackout-release-ubuntu

      - name: Format and verify Rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Test strict Release protocol wire
        run: cargo test -p protocol --locked control_plane_command::tests::blackout_release_command_wire_is_release_only_and_exactly_bound -- --exact --test-threads=1

      - name: Test R4 canonical policy
        run: cargo test -p protocol --locked control_plane_registry_v2::tests::output_disruptive_release_requires_r4_physical_consent_receipt_rate_and_no_full_lock -- --exact --test-threads=1

      - name: Test exact control-plane inventories
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p syndocal --bin syndocal --locked control_plane::tests::compiled_handler_and_registry_have_the_exact_same_set -- --exact --test-threads=1
          cargo test -p syndocal --bin syndocal --locked control_plane::tests::canonical_registry_derives_the_exact_current_source_inventory -- --exact --test-threads=1
          cargo test -p syndocal --bin syndocal --locked control_plane::tests::legacy_v1_registry_json_and_count_remain_inventory_honest -- --exact --test-threads=1

      - name: Test physical single-use Release consent
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p syndocal --bin syndocal --locked control_plane_security::tests::prepared_consent_is_physical_single_use_and_exactly_bound -- --exact --test-threads=1
          cargo test -p syndocal --bin syndocal --locked control_plane_security::tests::prepared_consent_rejects_other_r4_operations -- --exact --test-threads=1

      - name: Test deterministic Release terminal fence
        run: cargo test -p syndocal --bin syndocal --locked control_plane_runtime::tests::blackout_release_receipt_fence_is_exact_and_rolls_safely -- --exact --test-threads=1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Test Blackout Release renderer contract
        run: pnpm --dir app run check:blackout-release-runtime

      - name: Check frontend invoke inventory
        run: pnpm --dir app run check:frontend-invokes

      - name: Type-check frontend
        run: pnpm --dir app exec tsc --noEmit

      - name: Build frontend
        run: pnpm --dir app build

      - name: Commit verified R4 source without racing another writer
        shell: bash
        run: |
          set -euo pipefail
          start_head="$(cat "$RUNNER_TEMP/patch-start-head")"
          git fetch origin codex/ai3-r4-blackout-release
          remote_head="$(git rev-parse origin/codex/ai3-r4-blackout-release)"
          if [ "$remote_head" != "$start_head" ]; then
            echo "Work branch moved from $start_head to $remote_head; refusing stale write" >&2
            exit 1
          fi
          git config user.name "KTN"
          git config user.email "47689501+KTN44295080@users.noreply.github.com"
          git add -A
          git commit -m "fix: close strict blackout release wire lane"
          git push origin HEAD:codex/ai3-r4-blackout-release
