name: AI3 Compile Fix

on:
  push:
    branches:
      - codex/ai3-r4-blackout-release
    paths:
      - .github/workflows/diagnose-ai3-main.yml

permissions:
  contents: write

concurrency:
  group: ai3-compile-fix
  cancel-in-progress: true

jobs:
  fix-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libclang-dev \
            libssl-dev \
            libswscale-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            ffmpeg

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: syndocal-ai3-compile-fix-ubuntu

      - name: Apply exact platform guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src-tauri/src/main.rs")
          source = path.read_text(encoding="utf-8")
          old = """    spout
              .harvest_failed_workers(engine)
              .map_err(|error| error.to_string())?;
"""
          new = """    #[cfg(all(feature = \"spout\", target_os = \"windows\", target_arch = \"x86_64\"))]
    spout
              .harvest_failed_workers(engine)
              .map_err(|error| error.to_string())?;
"""
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one unguarded Spout harvest block, found {count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile and test Rust workspace
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        env:
          TARGET_BRANCH: codex/ai3-r4-blackout-release
        run: |
          rm .github/workflows/diagnose-ai3-main.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: guard Spout worker harvest by platform"
          git push origin "HEAD:${TARGET_BRANCH}"
