name: Cross-platform

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 10+
            os: windows-2022
          - name: macOS 12+
            os: macos-15
          - name: Ubuntu 22.04
            os: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libclang-dev \
            libssl-dev \
            libswscale-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            xvfb \
            ffmpeg

      - name: Install macOS video SDK
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg llvm pkg-config
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Windows video SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-shared.7z'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-shared'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z' -OutFile $archive
          & 7z x $archive "-o$extract" -y | Out-Null
          $sdk = Get-ChildItem $extract -Directory -Filter 'ffmpeg-*-full_build-shared' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdk) { throw 'The extracted FFmpeg SDK directory was not found.' }
          "FFMPEG_DIR=$sdk" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          (Join-Path $sdk 'bin') >> $env:GITHUB_PATH

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: syndocal-${{ matrix.os }}

      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Stage Windows runtime libraries
        if: runner.os == 'Windows'
        run: pnpm --dir app run prepare:runtime-libs

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Test in-process general video decode
        run: cargo test -p video --features libav --locked -- --test-threads=1

      - name: Build frontend
        run: pnpm --dir app build

      - name: Check Tauri application
        run: cargo check -p syndocal --features libav --locked

      - name: Check release metadata
        run: pnpm --dir app run check:release

      - name: Bundle Windows installers
        if: runner.os == 'Windows'
        run: pnpm --dir app tauri build --ci --bundles nsis,msi

      - name: Bundle macOS application
        if: runner.os == 'macOS'
        run: pnpm --dir app tauri build --ci --bundles app,dmg

      - name: Bundle Linux packages
        if: runner.os == 'Linux'
        run: pnpm --dir app tauri build --ci --bundles deb,appimage

      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process 'target/release/syndocal.exe' -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Syndocal exited during startup with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force

      - name: Smoke-test macOS application
        if: runner.os == 'macOS'
        run: |
          app_path=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_path"
          executable="$app_path/Contents/MacOS/syndocal"
          test -x "$executable"
          "$executable" & process_id=$!
          sleep 8
          kill -0 "$process_id"
          kill "$process_id"

      - name: Smoke-test Linux executable
        if: runner.os == 'Linux'
        run: |
          set +e
          timeout 8s xvfb-run -a target/release/syndocal
          exit_code=$?
          set -e
          test "$exit_code" -eq 124

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: syndocal-1.0.0-${{ matrix.os }}
          path: target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
