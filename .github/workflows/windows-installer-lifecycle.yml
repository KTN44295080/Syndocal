name: Windows installer lifecycle
on:
  push:
    branches: [codex/usb-dmx-blackout-alpha73-20261012]
    paths: [.github/workflows/windows-installer-lifecycle.yml, tools/distribution/SyndocalInstallations.ps1, tools/distribution/Remove-SyndocalData.ps1, tools/distribution/test-installed-windows-lifecycle.ps1, tools/distribution/test-windows-uninstall.mjs]
  workflow_dispatch:
    inputs:
      current_run_id:
        description: Successful alpha.73 Cross-platform run on this exact source
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  lifecycle:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Verify artifact source identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ inputs.current_run_id || '38160795680' }}
        run: |
          $current = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CURRENT_RUN_ID" | ConvertFrom-Json
          $baseline = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/38087767111" | ConvertFrom-Json
          if ($current.status -ne 'completed' -or $current.conclusion -ne 'success' -or $current.path -ne '.github/workflows/cross-platform.yml') { throw 'Current artifact source is not a successful cross-platform checkpoint' }
          # A branch-only workflow cannot be dispatched before it exists on the
          # default branch. A workflow-only follow-up may run the exact built
          # product, but product and lifecycle harness changes fail closed.
          git fetch --no-tags origin $current.head_sha
          if ($LASTEXITCODE -ne 0) { throw 'Artifact source could not be fetched' }
          # The registration reader ships alongside the installers in the ZIP;
          # it is deliberately tested from HEAD against unchanged installer bytes.
          git diff --quiet $current.head_sha HEAD -- app crates tools Cargo.toml Cargo.lock pnpm-lock.yaml .github/workflows/cross-platform.yml ':(exclude)tools/distribution/SyndocalInstallations.ps1' ':(exclude)tools/distribution/Remove-SyndocalData.ps1' ':(exclude)tools/distribution/test-installed-windows-lifecycle.ps1' ':(exclude)tools/distribution/test-windows-uninstall.mjs'
          if ($LASTEXITCODE -ne 0) { throw 'Product or lifecycle harness differs from the artifact source' }
          "ARTIFACT_SOURCE_COMMIT=$($current.head_sha)" >> $env:GITHUB_ENV
          if ($baseline.conclusion -ne 'success' -or $baseline.head_sha -ne '80fccf1401de2c2d8dc5c4ea2f03e9b96348d5eb') { throw 'Baseline artifact source mismatch' }
      - uses: actions/download-artifact@v5
        with:
          name: syndocal-1.2.0-alpha.72-windows-2022
          run-id: 38087767111
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v5
        with:
          name: syndocal-1.2.0-alpha.73-windows-2022
          run-id: ${{ inputs.current_run_id || '38160795680' }}
          github-token: ${{ github.token }}
          path: current
      - name: Test actual NSIS and MSI update and complete removal
        shell: pwsh
        env:
          CURRENT_RUN_ID: ${{ inputs.current_run_id || '38160795680' }}
        run: tools/distribution/test-installed-windows-lifecycle.ps1 -BaselineRoot baseline -CurrentRoot current -EvidencePath lifecycle-report.json
      - name: Record the verified artifact source
        if: always()
        shell: pwsh
        run: |
          foreach ($root in @('HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall','HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall')) {
            Get-ChildItem -LiteralPath $root | ForEach-Object { Get-ItemProperty -LiteralPath $_.PSPath } |
              Where-Object DisplayName -eq 'Syndocal' | Select-Object DisplayName,Publisher,InstallLocation,UninstallString | ConvertTo-Json
          }
          Get-ChildItem -LiteralPath $env:ProgramFiles,${env:ProgramFiles(x86)},$env:LOCALAPPDATA -Filter '*Syndocal*' -ErrorAction SilentlyContinue | Select-Object FullName
          if (Test-Path -LiteralPath lifecycle-report.json) {
            $report = Get-Content -LiteralPath lifecycle-report.json -Raw | ConvertFrom-Json
            $report | Add-Member -NotePropertyName artifactSourceCommit -NotePropertyValue $env:ARTIFACT_SOURCE_COMMIT
            $report | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath lifecycle-report.json -Encoding utf8
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-lifecycle-${{ github.sha }}
          path: lifecycle-report.json
          if-no-files-found: error
          retention-days: 14
