[package]
name = "syndocal"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["libav", "spout"]
asio = ["dep:libloading"]
libav = ["video/libav"]
ndi = ["io/ndi", "video/ndi"]
spout = ["dep:spout2-rs", "video/spout"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
audio = { path = "../../crates/audio" }
base64.workspace = true
crossbeam-queue.workspace = true
engine = { path = "../../crates/engine" }
flate2.workspace = true
gdtf = { path = "../../crates/gdtf" }
getrandom = "=0.2.17"
image.workspace = true
io = { path = "../../crates/io" }
minisign-verify.workspace = true
protocol = { path = "../../crates/protocol" }
rfd.workspace = true
rodio.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
video.workspace = true
visualizer.workspace = true
zip.workspace = true

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
spout2-rs = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
libloading = { workspace = true, optional = true }
webview2-com = "=0.37.0"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
