[workspace]
resolver = "2"
members = [
    "crates/audio",
    "crates/protocol",
    "crates/gdtf",
    "crates/io",
    "crates/engine",
    "crates/video",
    "crates/visualizer",
    "app/src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Seraf()のKTN"]
repository = "https://example.invalid/rayard"

[workspace.dependencies]
audio = { path = "crates/audio" }
crossbeam-queue = "0.3"
gdtf = { path = "crates/gdtf" }
image = { version = "=0.24.9", default-features = false, features = ["jpeg", "png"] }
hap-parser = "=0.2.0"
io = { path = "crates/io" }
midir = "0.11"
mp4 = "=0.14.0"
protocol = { path = "crates/protocol" }
pollster = "=0.4.0"
raw-window-handle = "=0.6.2"
rfd = "0.17"
roxmltree = "0.20"
rosc = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
tauri = { version = "=2.5.1", features = ["unstable"] }
tauri-build = "=2.2.0"
tauri-plugin-single-instance = "=2.2.2"
thiserror = "1"
tungstenite = "=0.24.0"
video = { path = "crates/video" }
visualizer = { path = "crates/visualizer" }
wgpu = { version = "=25.0.2", default-features = false, features = ["dx12", "metal", "vulkan", "gles", "wgsl"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
