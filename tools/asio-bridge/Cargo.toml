[package]
name = "syndocal-asio-bridge"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
build = "build.rs"

[lib]
name = "syndocal_asio_bridge"
crate-type = ["cdylib", "rlib"]

[package.metadata.syndocal]
abi_version = 2
canonical_dll = "syndocal_asio_bridge.dll"

[features]
default = []
asio = ["dep:cpal-asio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
cpal-asio = { package = "cpal", version = "=0.18.1", default-features = false, features = ["asio"], optional = true }

[profile.release]
panic = "unwind"
