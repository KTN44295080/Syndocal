name: macOS Installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: macOS 12+ arm64 DMG
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install macOS video SDK
        run: |
          brew install ffmpeg llvm pkg-config xz
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Cache macOS LGPL FFmpeg runtime
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-lgpl-8.1.2
          key: ffmpeg-lgpl-8.1.2-macos-${{ runner.arch }}-v1

      - name: Build macOS LGPL FFmpeg runtime
        run: |
          prefix="$HOME/ffmpeg-lgpl-8.1.2"
          if [[ ! -f "$prefix/lib/libavcodec.dylib" ]]; then
            archive="$RUNNER_TEMP/ffmpeg-8.1.2.tar.xz"
            source_dir="$RUNNER_TEMP/ffmpeg-8.1.2"
            curl --fail --location --retry 3 \
              https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz \
              --output "$archive"
            tar -xf "$archive" -C "$RUNNER_TEMP"
            cd "$source_dir"
            MACOSX_DEPLOYMENT_TARGET=12.0 ./configure \
              --prefix="$prefix" \
              --disable-programs \
              --disable-doc \
              --disable-debug \
              --disable-gpl \
              --disable-autodetect \
              --enable-version3 \
              --disable-static \
              --enable-shared \
              --enable-pic \
              --extra-cflags=-mmacosx-version-min=12.0 \
              --extra-ldflags=-mmacosx-version-min=12.0
            make -j3
            make install
          fi
          echo "FFMPEG_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Bundle macOS application and DMG
        run: |
          pnpm --dir app tauri build --ci --bundles app
          bash app/scripts/bundle-macos-runtime.sh \
            target/release/bundle/macos/Syndocal.app \
            target/release/bundle/dmg

      - name: Smoke-test macOS application and DMG
        run: |
          app_path=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_path"
          executable="$app_path/Contents/MacOS/syndocal"
          test -x "$executable"
          env -u DYLD_LIBRARY_PATH "$executable" & process_id=$!
          sleep 8
          kill -0 "$process_id"
          kill "$process_id"

          dmg_path=$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg_path"
          hdiutil imageinfo "$dmg_path" >/dev/null
          shasum -a 256 "$dmg_path" > "$dmg_path.sha256"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: syndocal-macos-${{ runner.arch }}-${{ github.sha }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/dmg/*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
