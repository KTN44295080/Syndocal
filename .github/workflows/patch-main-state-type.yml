name: Patch scoped project-load state type

on:
  push:
    branches:
      - codex/ai3-r4-blackout-release
    paths:
      - .github/scripts/patch_main_state_type.py
      - .github/workflows/patch-main-state-type.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the exact work branch
        uses: actions/checkout@v5
        with:
          ref: codex/ai3-r4-blackout-release
          fetch-depth: 0

      - name: Verify branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "codex/ai3-r4-blackout-release"
          git merge-base --is-ancestor df7e335c14fe82bb534fbd8867dcd431777e1522 HEAD

      - name: Apply the exact state-type patch
        run: python .github/scripts/patch_main_state_type.py

      - name: Verify the patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- app/src-tauri/src/main.rs && {
            echo "Expected main.rs to change" >&2
            exit 1
          }
          git diff --stat -- app/src-tauri/src/main.rs

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KTN"
          git config user.email "47689501+KTN44295080@users.noreply.github.com"
          git add app/src-tauri/src/main.rs
          git commit -m "fix: accept AppState in project load core"
          git push origin HEAD:codex/ai3-r4-blackout-release
