name: Cross-platform

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 10+
            os: windows-2022
          - name: macOS 12+
            os: macos-15
          - name: Ubuntu 22.04
            os: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libclang-dev \
            libssl-dev \
            libswscale-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            xvfb \
            ffmpeg

      - name: Install macOS video SDK
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg llvm pkg-config xz
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Cache macOS LGPL FFmpeg runtime
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-lgpl-8.1.2
          key: ffmpeg-lgpl-8.1.2-macos15-arm64-v2

      - name: Build macOS LGPL FFmpeg runtime
        if: runner.os == 'macOS'
        run: |
          prefix="$HOME/ffmpeg-lgpl-8.1.2"
          if [[ ! -f "$prefix/lib/libavcodec.dylib" ]]; then
            archive="$RUNNER_TEMP/ffmpeg-8.1.2.tar.xz"
            source_dir="$RUNNER_TEMP/ffmpeg-8.1.2"
            curl --fail --location --retry 3 \
              https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz \
              --output "$archive"
            tar -xf "$archive" -C "$RUNNER_TEMP"
            cd "$source_dir"
            MACOSX_DEPLOYMENT_TARGET=12.0 ./configure \
              --prefix="$prefix" \
              --disable-programs \
              --disable-doc \
              --disable-debug \
              --disable-gpl \
              --disable-autodetect \
              --enable-version3 \
              --disable-static \
              --enable-shared \
              --enable-pic \
              --extra-cflags=-mmacosx-version-min=12.0 \
              --extra-ldflags=-mmacosx-version-min=12.0
            make -j3
            make install
          fi
          echo "FFMPEG_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"

      - name: Install Windows video SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl-shared.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-shared'
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $sdk = Get-ChildItem $extract -Directory -Filter 'ffmpeg-n8.1-*-win64-lgpl-shared*' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdk) { throw 'The extracted FFmpeg SDK directory was not found.' }
          "FFMPEG_DIR=$sdk" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          (Join-Path $sdk 'bin') >> $env:GITHUB_PATH

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Initialize Windows x64 MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: syndocal-lgpl-v1-${{ matrix.os }}

      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Stage Windows runtime libraries
        if: runner.os == 'Windows'
        run: pnpm --dir app run prepare:runtime-libs

      - name: Validate Windows warning ratchet SDK paths
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # These SDKs are deliberately not downloaded by CI: NDI and ASIO
          # require an explicit, locally licensed runner installation. An
          # absent repository variable therefore fails the ratchet closed.
          NDI_SDK_DIR: ${{ vars.NDI_SDK_DIR }}
          CPAL_ASIO_DIR: ${{ vars.CPAL_ASIO_DIR }}
        run: |
          $required = @('FFMPEG_DIR', 'LIBCLANG_PATH', 'NDI_SDK_DIR', 'CPAL_ASIO_DIR')
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name, 'Process')
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "$name is required for the Windows warning ratchet and is not configured."
            }
            if (-not (Test-Path -LiteralPath $value -PathType Container)) {
              throw "$name must name an existing directory: $value"
            }
          }
          $requiredFiles = @{
            FFMPEG_DIR = @('include', 'lib', 'bin')
            LIBCLANG_PATH = @('libclang.dll')
            NDI_SDK_DIR = @('Include', 'Lib\x64', 'Bin\x64')
            CPAL_ASIO_DIR = @('common\asio.h', 'common\asiosys.h', 'host\asiodrivers.h')
          }
          foreach ($entry in $requiredFiles.GetEnumerator()) {
            foreach ($relative in $entry.Value) {
              $candidate = Join-Path ([Environment]::GetEnvironmentVariable($entry.Key, 'Process')) $relative
              $pathType = if ($relative.Contains('.')) { 'Leaf' } else { 'Container' }
              if (-not (Test-Path -LiteralPath $candidate -PathType $pathType)) {
                throw "$($entry.Key) is missing required SDK path: $candidate"
              }
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "NDI_SDK_DIR=$env:NDI_SDK_DIR"
          Add-Content -Path $env:GITHUB_ENV -Value "CPAL_ASIO_DIR=$env:CPAL_ASIO_DIR"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test warning ratchet
        run: pnpm --dir app run check:warnings:self-test

      - name: Enforce Windows warning ratchets
        if: runner.os == 'Windows'
        env:
          WARNING_RATCHET_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          WARNING_RATCHET_HEAD_REF: ${{ github.sha }}
        run: |
          pnpm --dir app run check:warnings -- --configuration windows-default-all-targets
          pnpm --dir app run check:warnings -- --configuration windows-default-release
          pnpm --dir app run check:warnings -- --configuration windows-workspace-tests
          pnpm --dir app run check:warnings -- --configuration windows-syndocal-spout
          pnpm --dir app run check:warnings -- --configuration windows-syndocal-asio
          pnpm --dir app run check:warnings -- --configuration windows-syndocal-ndi
          pnpm --dir app run check:warnings -- --configuration windows-asio-bridge
          pnpm --dir app run check:warnings -- --configuration frontend-typescript-vite-windows

      - name: Stop checkout Syndocal before native warning ratchet
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'target\release\syndocal.exe'))
          Get-CimInstance Win32_Process | ForEach-Object {
            $executable = $_.ExecutablePath
            if (-not [string]::IsNullOrWhiteSpace($executable)) {
              try { $resolved = [IO.Path]::GetFullPath($executable) } catch { $resolved = $null }
              if ($resolved -and $resolved.Equals($target, [StringComparison]::OrdinalIgnoreCase)) {
                Stop-Process -Id $_.ProcessId -Force -ErrorAction Stop
              }
            }
          }

      - name: Enforce Windows native release warning ratchet
        if: runner.os == 'Windows'
        env:
          WARNING_RATCHET_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          WARNING_RATCHET_HEAD_REF: ${{ github.sha }}
        run: pnpm --dir app run check:warnings -- --configuration windows-native-release

      - name: Test Rust workspace
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Test in-process general video decode
        run: cargo test -p video --features libav --locked -- --test-threads=1

      - name: Build frontend
        run: pnpm --dir app build

      - name: Check E4 project publication durability
        run: pnpm --dir app run check:project-publication-e4

      - name: Check Tauri application
        run: cargo check -p syndocal --features libav --locked

      - name: Check release metadata
        run: pnpm --dir app run check:release

      - name: Stop checkout Syndocal before native bundle build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'target\release\syndocal.exe'))
          Get-CimInstance Win32_Process | ForEach-Object {
            $executable = $_.ExecutablePath
            if (-not [string]::IsNullOrWhiteSpace($executable)) {
              try { $resolved = [IO.Path]::GetFullPath($executable) } catch { $resolved = $null }
              if ($resolved -and $resolved.Equals($target, [StringComparison]::OrdinalIgnoreCase)) {
                Stop-Process -Id $_.ProcessId -Force -ErrorAction Stop
              }
            }
          }

      - name: Bundle Windows installers
        if: runner.os == 'Windows'
        run: pnpm --dir app tauri build --ci --bundles nsis,msi

      - name: Bundle macOS application
        if: runner.os == 'macOS'
        run: |
          pnpm --dir app tauri build --ci --bundles app
          bash app/scripts/bundle-macos-runtime.sh \
            target/release/bundle/macos/Syndocal.app \
            target/release/bundle/dmg

      - name: Bundle Linux packages
        if: runner.os == 'Linux'
        run: pnpm --dir app tauri build --ci --bundles deb,appimage

      - name: Smoke-test Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          $msi = Get-ChildItem 'target/release/bundle/msi/*.msi' | Select-Object -First 1
          if (-not $nsis -or -not $msi) { throw 'Expected NSIS and MSI installers.' }

          $installDir = Join-Path $env:RUNNER_TEMP 'SyndocalSmoke'
          $extractDir = Join-Path $env:RUNNER_TEMP 'SyndocalMsiExtract'
          $installer = Start-Process $nsis.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "NSIS install failed with code $($installer.ExitCode)." }
          if (-not (Test-Path "$installDir/syndocal.exe")) { throw 'NSIS did not install syndocal.exe.' }
          if (-not (Get-ChildItem "$installDir/avcodec-*.dll" -ErrorAction SilentlyContinue)) {
            throw 'NSIS did not install FFmpeg DLLs beside syndocal.exe.'
          }

          $process = Start-Process "$installDir/syndocal.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Installed Syndocal exited during startup with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force

          $adminInstall = Start-Process msiexec.exe -ArgumentList '/a', $msi.FullName, '/qn', "TARGETDIR=$extractDir" -Wait -PassThru
          if ($adminInstall.ExitCode -ne 0) { throw "MSI extraction failed with code $($adminInstall.ExitCode)." }
          $msiExe = Get-ChildItem $extractDir -Filter syndocal.exe -Recurse | Select-Object -First 1
          if (-not $msiExe) { throw 'MSI did not contain syndocal.exe.' }
          if (-not (Get-ChildItem $msiExe.DirectoryName -Filter 'avcodec-*.dll')) {
            throw 'MSI did not place FFmpeg DLLs beside syndocal.exe.'
          }

          $uninstaller = Join-Path $installDir 'uninstall.exe'
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall failed with code $($uninstall.ExitCode)." }
          }

      - name: Smoke-test macOS application
        if: runner.os == 'macOS'
        run: |
          app_path=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_path"
          executable="$app_path/Contents/MacOS/syndocal"
          test -x "$executable"
          env -u DYLD_LIBRARY_PATH "$executable" & process_id=$!
          sleep 8
          kill -0 "$process_id"
          kill "$process_id"

      - name: Smoke-test Linux AppImage
        if: runner.os == 'Linux'
        run: |
          appimage=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$appimage"
          chmod +x "$appimage"
          set +e
          timeout 8s xvfb-run -a "$appimage" --appimage-extract-and-run
          exit_code=$?
          set -e
          test "$exit_code" -eq 124

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: syndocal-1.2.0-alpha.11-${{ matrix.os }}
          path: target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
