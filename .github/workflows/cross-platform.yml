name: Cross-platform

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 10+
            os: windows-2022
          - name: macOS 12+
            os: macos-15
          - name: Ubuntu 22.04
            os: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libclang-dev \
            libssl-dev \
            libswscale-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            xvfb \
            ffmpeg

      - name: Install macOS video SDK
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg llvm pkg-config xz
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Cache macOS LGPL FFmpeg runtime
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-lgpl-8.1.2
          key: ffmpeg-lgpl-8.1.2-macos15-arm64-v1

      - name: Build macOS LGPL FFmpeg runtime
        if: runner.os == 'macOS'
        run: |
          prefix="$HOME/ffmpeg-lgpl-8.1.2"
          if [[ ! -f "$prefix/lib/libavcodec.dylib" ]]; then
            archive="$RUNNER_TEMP/ffmpeg-8.1.2.tar.xz"
            source_dir="$RUNNER_TEMP/ffmpeg-8.1.2"
            curl --fail --location --retry 3 \
              https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz \
              --output "$archive"
            tar -xf "$archive" -C "$RUNNER_TEMP"
            cd "$source_dir"
            MACOSX_DEPLOYMENT_TARGET=12.0 ./configure \
              --prefix="$prefix" \
              --disable-programs \
              --disable-doc \
              --disable-debug \
              --disable-gpl \
              --enable-version3 \
              --disable-static \
              --enable-shared \
              --enable-pic \
              --extra-cflags=-mmacosx-version-min=12.0 \
              --extra-ldflags=-mmacosx-version-min=12.0
            make -j3
            make install
          fi
          echo "FFMPEG_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"

      - name: Install Windows video SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl-shared.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-shared'
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $sdk = Get-ChildItem $extract -Directory -Filter 'ffmpeg-n8.1-*-win64-lgpl-shared*' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdk) { throw 'The extracted FFmpeg SDK directory was not found.' }
          "FFMPEG_DIR=$sdk" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          (Join-Path $sdk 'bin') >> $env:GITHUB_PATH

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: syndocal-${{ matrix.os }}

      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Stage Windows runtime libraries
        if: runner.os == 'Windows'
        run: pnpm --dir app run prepare:runtime-libs

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Test in-process general video decode
        run: cargo test -p video --features libav --locked -- --test-threads=1

      - name: Build frontend
        run: pnpm --dir app build

      - name: Check Tauri application
        run: cargo check -p syndocal --features libav --locked

      - name: Check release metadata
        run: pnpm --dir app run check:release

      - name: Bundle Windows installers
        if: runner.os == 'Windows'
        run: pnpm --dir app tauri build --ci --bundles nsis,msi

      - name: Bundle macOS application
        if: runner.os == 'macOS'
        run: |
          pnpm --dir app tauri build --ci --bundles app
          bash app/scripts/bundle-macos-runtime.sh \
            target/release/bundle/macos/Syndocal.app \
            target/release/bundle/dmg

      - name: Bundle Linux packages
        if: runner.os == 'Linux'
        run: pnpm --dir app tauri build --ci --bundles deb,appimage

      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process 'target/release/syndocal.exe' -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Syndocal exited during startup with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force

      - name: Smoke-test macOS application
        if: runner.os == 'macOS'
        run: |
          app_path=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_path"
          executable="$app_path/Contents/MacOS/syndocal"
          test -x "$executable"
          env -u DYLD_LIBRARY_PATH "$executable" & process_id=$!
          sleep 8
          kill -0 "$process_id"
          kill "$process_id"

      - name: Smoke-test Linux executable
        if: runner.os == 'Linux'
        run: |
          set +e
          timeout 8s xvfb-run -a target/release/syndocal
          exit_code=$?
          set -e
          test "$exit_code" -eq 124

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: syndocal-1.0.0-${{ matrix.os }}
          path: target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
