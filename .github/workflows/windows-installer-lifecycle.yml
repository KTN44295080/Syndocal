name: Windows installer lifecycle
on:
  workflow_dispatch:
    inputs:
      current_run_id:
        description: Successful alpha.79 Cross-platform run on this exact source
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  lifecycle:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Verify artifact source identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ inputs.current_run_id }}
        run: |
          $current = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CURRENT_RUN_ID" | ConvertFrom-Json
          $baseline = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/38087767111" | ConvertFrom-Json
          if ($current.status -ne 'completed' -or $current.conclusion -ne 'success' -or $current.path -ne '.github/workflows/cross-platform.yml') { throw 'Current artifact source is not a successful cross-platform checkpoint' }
          # A branch-only workflow cannot be dispatched before it exists on the
          # default branch. A workflow-only follow-up may run the exact built
          # native product. Sidecar helpers and the test harness are tested
          # from HEAD and reported separately from the built product source.
          git fetch --no-tags origin $current.head_sha
          if ($LASTEXITCODE -ne 0) { throw 'Artifact source could not be fetched' }
          # The registration reader ships alongside the installers in the ZIP;
          # it is deliberately tested from HEAD against unchanged installer bytes.
          # The exact Mac-only DMG assembly script is not a Windows build input or shipped resource.
          # Its isolated volume-sizing repair does not change the Windows payload.
          # Versioned ZIP sidecars are finalized from exact installer hashes after
          # native build; their real-helper seam/ValidateOnly evidence is separate.
          git diff --quiet $current.head_sha HEAD -- app crates tools Cargo.toml Cargo.lock pnpm-lock.yaml .github/workflows/cross-platform.yml ':(exclude)app/scripts/bundle-macos-runtime.sh' ':(exclude)tools/distribution/SyndocalInstallations.ps1' ':(exclude)tools/distribution/Remove-SyndocalData.ps1' ':(exclude)tools/distribution/test-installed-windows-lifecycle.ps1' ':(exclude)tools/distribution/test-windows-uninstall.mjs' ':(exclude)tools/distribution/test-windows-cleanup.mjs' ':(exclude)tools/distribution/alpha79/Install-Windows.cmd' ':(exclude)tools/distribution/alpha79/Install-Windows.ps1' ':(exclude)tools/distribution/alpha79/README.txt' ':(exclude)tools/distribution/alpha79/使い方.txt' ':(exclude)tools/distribution/alpha79/check-setup-helper.mjs' ':(exclude)app/src-tauri/src/extensions.rs'
          if ($LASTEXITCODE -ne 0) { throw 'Native product or embedded installer hook differs from the artifact source' }
          # Only the exact recorded Mac temporary-path test addition may differ.
          # Removing it must make the entire module byte-identical after EOL normalization.
          $builtExtensions = (git show "$($current.head_sha):app/src-tauri/src/extensions.rs") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read built extension module' }
          $builtExtensions += "`n"
          $headExtensions = [IO.File]::ReadAllText((Join-Path (Get-Location) 'app/src-tauri/src/extensions.rs')).Replace("`r`n","`n")
          if ($builtExtensions -cne $headExtensions) {
            $fixtureOnly = "        // macOS exposes its temporary directory through the system /var alias.`n        // Exercise installer path policy with the actual owned directory.`n        let directory = fs::canonicalize(directory).unwrap();`n"
            if ([regex]::Matches($headExtensions,[regex]::Escape($fixtureOnly)).Count -ne 1 -or $headExtensions.Replace($fixtureOnly,'') -cne $builtExtensions) {
              throw 'Extension runtime differs from the built product; only the exact test fixture correction is allowed'
            }
          }
          "ARTIFACT_SOURCE_COMMIT=$($current.head_sha)" >> $env:GITHUB_ENV
          if ($baseline.conclusion -ne 'success' -or $baseline.head_sha -ne '80fccf1401de2c2d8dc5c4ea2f03e9b96348d5eb') { throw 'Baseline artifact source mismatch' }
      - uses: actions/download-artifact@v5
        with:
          name: syndocal-1.2.0-alpha.72-windows-2022
          run-id: 38087767111
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v5
        with:
          name: syndocal-1.2.0-alpha.79-windows-2022
          run-id: ${{ inputs.current_run_id }}
          github-token: ${{ github.token }}
          path: current
      - name: Test actual NSIS and MSI update and complete removal
        shell: pwsh
        env:
          CURRENT_RUN_ID: ${{ inputs.current_run_id }}
        run: tools/distribution/test-installed-windows-lifecycle.ps1 -BaselineRoot baseline -CurrentRoot current -EvidencePath lifecycle-report.json
      - name: Record the verified artifact source
        if: always()
        shell: pwsh
        run: |
          foreach ($root in @('HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall','HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall')) {
            Get-ChildItem -LiteralPath $root -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty -LiteralPath $_.PSPath } |
              Where-Object DisplayName -eq 'Syndocal' | Select-Object DisplayName,Publisher,InstallLocation,UninstallString | ConvertTo-Json
          }
          Get-ChildItem -LiteralPath $env:ProgramFiles,${env:ProgramFiles(x86)},$env:LOCALAPPDATA -Filter '*Syndocal*' -ErrorAction SilentlyContinue | Select-Object FullName
          if (Test-Path -LiteralPath lifecycle-report.json) {
            $report = Get-Content -LiteralPath lifecycle-report.json -Raw | ConvertFrom-Json
            $report | Add-Member -NotePropertyName artifactSourceCommit -NotePropertyValue $env:ARTIFACT_SOURCE_COMMIT
            $report | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath lifecycle-report.json -Encoding utf8
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-lifecycle-${{ github.sha }}
          path: lifecycle-report.json
          if-no-files-found: error
          retention-days: 14
